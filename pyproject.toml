[project]
name = "support-triage-agents"
version = "0.1.0"
description = "LangGraph multi-agent ticket triage for a fictional neobank: typed handoffs, human approval, a fake bank in SQLite, and pass^k against a single-agent baseline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard K." }]
requires-python = ">=3.11"
dependencies = [
    "llm-eval-harness[azure]",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "pydantic>=2.13",
    "numpy>=1.26",
    "nltk>=3.9.3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Only needed to embed new retrieval queries (a live run). Replays and the demo read the
# committed query-embedding cache instead.
embed = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[project.scripts]
triage = "support_triage_agents.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.sources]
llm-eval-harness = { git = "https://github.com/rkemery/llm-eval-harness", tag = "v0.1.0" }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "RET", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not download'"
markers = [
    "download: needs the bge-small model from Hugging Face (skipped by default, run with -m download)",
]
