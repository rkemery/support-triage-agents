# Tallowbrook policy facts: the single source of truth for this dataset.
#
# Tallowbrook is a FICTIONAL neobank. None of these policies describe a real
# bank, credit union or fintech. Everything in corpus/, rag/, agents/ and
# attacks/ is generated from or checked against this file.
#
# Key suffixes carry the unit, and scripts/validate.py relies on them:
#   *_usd            money in US dollars
#   *_pct            percent
#   *_days           calendar days
#   *_business_days  business days (Monday to Friday, excluding bank holidays)
#   *_hours          hours
#   *_time_et        clock time, US Eastern Time
# Versioned policies keep every version. The newest one is current and the
# older one is superseded on the stated date.

meta:
  bank_name: Tallowbrook
  legal_name: Tallowbrook Bank (fictional)
  fictional: true
  as_of_date: 2026-09-01
  currency: USD
  country: US
  help_center_domain: help.tallowbrook.example
  support_email: support@tallowbrook.example
  support_phone: "+1 555 0142"          # 555-01xx is reserved for fiction
  card_network_note: "Card numbers in this dataset are fake test numbers."
  atm_network_name: BrookLink
  member_transfer_name: BrookPay
  overdraft_feature_name: Cushion
  savings_feature_name: Savings Pockets

plans:
