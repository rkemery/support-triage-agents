# ---------------------------------------------------------------- plan billing
plan_billing:
  upgrade: "Takes effect immediately. The new plan's full monthly fee is charged that day, and that day becomes the new billing date."
  downgrade: "Takes effect on the next billing date. No partial refund for the current month."
  proration: false
  cooling_off_days: 14          # full refund of the FIRST paid plan charge if you leave the paid plan within this window
  cooling_off_scope: "Only the first paid-plan charge on the account, ever. The plan returns to Basic right away."
  failed_payment_retry_days: 3  # a failed plan fee is retried after this many days
  failed_payment_rule: "If the plan fee can't be collected on the billing date or on the retry, the plan moves to Basic."

